name: Scrape prices (sin WhatsApp, mas frecuente)

on:
  schedule:
    # Issue #121: de 5x/día a cada hora en horario de uso ART (~07-22 ART =
    # 10-23,0-1 UTC), ahora que el runner público no tiene límite práctico de
    # minutos (issue #119). Sin cambios en el repo privado.
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
    - cron: "17 15 * * *"
    - cron: "17 16 * * *"
    - cron: "17 17 * * *"
    - cron: "17 18 * * *"
    - cron: "17 19 * * *"
    - cron: "17 20 * * *"
    - cron: "17 21 * * *"
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scrape-brasil-precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: PabloNicolasAcevedo/brasil-precios-ba
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run scraper (sin WhatsApp)
        env:
          SKIP_WHATSAPP: "1"
          QUEUE_PG_WRITES: "1"
          PG_INGEST_URL: ${{ secrets.PG_INGEST_URL }}
          PG_INGEST_TOKEN: ${{ secrets.PG_INGEST_TOKEN }}
          EXCHANGE_RATE_URL: ${{ secrets.EXCHANGE_RATE_URL }}
        run: node index.js

      - name: Commit results
        run: |
          git config user.name "brasil-precios-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/commitIngestState.sh "Actualiza estado de ingesta (sin WhatsApp) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
