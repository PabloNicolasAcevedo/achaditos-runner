name: diag-neway (temporal)
on:
  push:
    branches: [diag-neway]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: PabloNicolasAcevedo/brasil-precios-ba
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Scraper real de Neway
        run: |
          git log --oneline -3
          grep -n "cb-prod-card\|Accept-Language" scrapers/odooShop.js | head
          cat > d.js <<'JS'
          const o = require("./scrapers/odooShop");
          const H = { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36", "Accept-Language": "es-AR,es;q=0.9" };
          (async () => {
            const t = await (await fetch("https://www.newaymarket.com/shop", { headers: H })).text();
            const items = o.parseListingPage(t, "https://www.newaymarket.com");
            console.log("parseListingPage directo:", items.length, JSON.stringify(items[0]));
            const all = await require("./scrapers/newaymarket").run();
            console.log("run():", all.length);
          })().catch((e) => console.log("ERROR", e));
          JS
          node d.js
