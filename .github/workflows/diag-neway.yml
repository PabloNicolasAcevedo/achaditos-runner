name: diag-neway (temporal)
on:
  push:
    branches: [diag-neway]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probar Neway desde GitHub
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36'
          curl -s ifconfig.io/country_code || true
          for u in https://www.newaymarket.com/shop https://www.newaymarket.com/shop/page/2; do
            echo "=== $u"
            curl -s -L -o page.html -D headers.txt -w 'final=%{url_effective} code=%{http_code} size=%{size_download}\n' -A "$UA" -H 'Accept-Language: es-AR,es;q=0.9' "$u"
            grep -iE '^(HTTP|location|server|cf-|set-cookie|content-type)' headers.txt | cut -c1-200
            echo "oe_product: $(grep -o 'class="oe_product ' page.html | wc -l)  cb-name: $(grep -o 'cb-prod-card__name' page.html | wc -l)"
            grep -o '<title>[^<]*' page.html | head -2
            sed -e 's/<[^>]*>/ /g' page.html | tr -s ' \n' | grep -v '^\s*$' | head -c 1500; echo
          done
